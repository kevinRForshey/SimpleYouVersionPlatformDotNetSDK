name: CI

on:
  push:
    branches: [Development, main, Dev-Refactoring]  # TODO: remove Dev-Refactoring once CI is verified on this branch
  pull_request:
    branches: [Development, main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    # Windows runners default to pwsh, but the steps below use bash-isms (mkdir -p, cat >> ...).
    # GitHub-hosted Windows runners ship Git Bash, so forcing bash here keeps one script for both OSes.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # nuget.config points a local package source ("BibleLocal") at ./packages, which
      # PlatformTestApp restores BiblePlatform.SDK.Components from. NuGet requires local
      # source directories to exist at restore time -- even for projects that don't consume
      # anything from them -- or restore fails with NU1301, so create it before any restore runs.
      - name: Create local NuGet feed directory
        run: mkdir -p packages

      # PlatformTestApp consumes BiblePlatform.SDK.Components as a packed NuGet
      # package (via the "BibleLocal" feed in nuget.config), not a ProjectReference,
      # so it exercises the real consumer experience. Build and pack the libraries in
      # dependency order first so that feed is populated before anything restores against it.
      - name: Build libraries
        run: |
          dotnet build Platform.API.Models -c Release
          dotnet build BiblePlatform.UsfmReferences -c Release
          dotnet build Platform.API -c Release
          dotnet build Platform.SDK.Services -c Release
          dotnet build Platform.SDK.Components -c Release
          dotnet build Platform.API.Benchmarks -c Release
          dotnet build PlatformConsoleSample -c Release

      - name: Test
        run: |
          dotnet test Platform.API.Tests -c Release --verbosity normal --collect:"XPlat Code Coverage"
          dotnet test BiblePlatform.UsfmReferences.Tests -c Release --verbosity normal --collect:"XPlat Code Coverage"
          dotnet test Platform.SDK.Services.Tests -c Release --verbosity normal --collect:"XPlat Code Coverage"
          dotnet test Platform.SDK.Components.Tests -c Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Scan for vulnerable NuGet packages
        run: dotnet list BiblePlatform.slnx package --vulnerable --include-transitive

      - name: Pack libraries to local feed
        run: |
          mkdir -p packages
          dotnet pack Platform.API.Models -c Release --no-build -o packages
          dotnet pack BiblePlatform.UsfmReferences -c Release --no-build -o packages
          dotnet pack Platform.API -c Release --no-build -o packages
          dotnet pack Platform.SDK.Services -c Release --no-build -o packages
          dotnet pack Platform.SDK.Components -c Release --no-build -o packages

      - name: Build PlatformTestApp
        run: dotnet build PlatformTestApp -c Release

      - name: Test PlatformTestApp
        run: dotnet test PlatformTestApp.Tests -c Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ matrix.os }}
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: warn

      - name: Summarize coverage
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.10
        with:
          reports: '**/TestResults/**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'MarkdownSummaryGithub;Cobertura'

      - name: Publish coverage summary
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Deterministic pipeline gate, not an AI judgment call: fails the build if merged
      # line coverage drops below the floor. 35% is a conservative starting point (well
      # below every project's individually-measured baseline) chosen to catch a gross
      # regression without false-failing on the merged report's first real run -- raise it
      # once a few CI runs confirm the actual steady-state merged percentage.
      - name: Enforce coverage floor
        run: |
          LINE_RATE=$(grep -m1 -oE 'line-rate="[0-9.]+"' coveragereport/Cobertura.xml | grep -oE '[0-9.]+')
          if [ -z "$LINE_RATE" ]; then
            echo "Could not read line-rate from coveragereport/Cobertura.xml" >&2
            exit 1
          fi

          case "$LINE_RATE" in
            *.*) DECIMALS="${LINE_RATE#*.}0000"; BASIS_POINTS=$((10#${DECIMALS:0:4})) ;;
            *) BASIS_POINTS=$((LINE_RATE * 10000)) ;;
          esac
          THRESHOLD=3500

          PERCENT_WHOLE=$((BASIS_POINTS / 100))
          PERCENT_FRACTION=$((BASIS_POINTS % 100))
          echo "Merged line coverage: ${PERCENT_WHOLE}.${PERCENT_FRACTION}% (floor: 35%)"

          if [ "$BASIS_POINTS" -lt "$THRESHOLD" ]; then
            echo "Line coverage is below the 35% floor." >&2
            exit 1
          fi
